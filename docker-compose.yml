version: '3.8'

services:
  server:
    build: ./server
    ports:
      # 仅本机可访问（调试用）；公网入口统一走 client 的 nginx（80），避免 token 明文直连 API
      - "127.0.0.1:3001:3001"
    volumes:
      # 数据库持久化（SQLite 文件位于 /app/prisma）
      - server_data:/app/prisma
      # 每日自动备份目录持久化
      - server_backups:/app/backups
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      # 生产环境必填（config.ts 会拒绝默认/空密钥）
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?请在 .env 中配置 JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?请在 .env 中配置 JWT_REFRESH_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - PORT=3001
      - CLIENT_URL=http://localhost
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_data:
  server_backups:
